name: Update ClientPulse Dashboard

on:
  schedule:
      # Every Tuesday at 11:00 AM Eastern (15:00 UTC)
          - cron: '0 15 * * 2'
            workflow_dispatch:

            jobs:
              update:
                  runs-on: ubuntu-latest
                      permissions:
                            contents: write

                                steps:
                                      - name: Checkout repo
                                              uses: actions/checkout@v4

                                                    - name: Set up Python
                                                            uses: actions/setup-python@v5
                                                                    with:
                                                                              python-version: '3.11'

                                                                                    - name: Generate updated dashboard
                                                                                            run: python3 generate_dashboard.py

                                                                                                  - name: Commit and push updated index.html
                                                                                                          run: |
                                                                                                                    git config user.name  "ClientPulse Bot"
                                                                                                                              git config user.email "bot@sparknav.com"
                                                                                                                                        git add index.html
                                                                                                                                                  git diff --staged --quiet || git commit -m "Weekly dashboard update"
                                                                                                                                                            git push
