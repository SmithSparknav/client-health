<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ClientPulse — SparkNav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0C1F38;--blue:#145484;--light:#4E9BE3;--risk:#FF2D2D;--risk-bg:#FFF1F1;--risk-bd:#FFB3B3;--risk-tx:#B00020;--watch:#FFC400;--watch-bg:#FFF9DB;--watch-bd:#FFE066;--watch-tx:#8A5A00;--healthy:#22C55E;--healthy-bg:#ECFDF3;--healthy-bd:#86EFAC;--healthy-tx:#14532D;--ink:#0C1F38;--slate:#3D5A7A;--muted:#7A9BB5;--line:#D0DFE9;--surface:#F2F7FB;--card:#FFFFFF;--f:'Sora',sans-serif;--m:'JetBrains Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{-webkit-font-smoothing:antialiased}body{font-family:var(--f);background:var(--surface);color:var(--ink)}
.nav{background:var(--navy);height:62px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300}.nav-l{display:flex;align-items:center;gap:12px}.nav-logo{height:34px;width:auto;object-fit:contain}.nav-prod{font-size:12px;font-weight:500;color:rgba(255,255,255,.55)}.nav-r{display:flex;align-items:center;gap:12px}.live-pill{display:flex;align-items:center;gap:6px;background:rgba(78,155,227,.1);border:1px solid rgba(78,155,227,.2);border-radius:20px;padding:4px 11px;font-size:11px;color:var(--light);font-family:var(--m)}.live-dot{width:6px;height:6px;border-radius:50%;background:#4ADE80}.nav-date{font-size:11px;color:rgba(255,255,255,.22);font-family:var(--m)}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 58%,#1F7CC0 100%);padding:26px 28px 34px}.hero-eyebrow{font-size:10px;font-family:var(--m);letter-spacing:1.5px;text-transform:uppercase;color:var(--light);margin-bottom:5px}.hero-title{font-size:18px;font-weight:700;color:white;margin-bottom:18px}.hero-row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}.overall{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:16px 20px;min-width:240px;display:flex;align-items:center;gap:14px}.overall-ring{position:relative;width:64px;height:64px;flex-shrink:0}.overall-ring svg{transform:rotate(-90deg)}.overall-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;font-family:var(--m)}.overall-label{font-size:10px;font-family:var(--m);text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.45);margin-bottom:4px}.overall-status{font-size:18px;font-weight:700;color:white}.overall-sub{font-size:11px;color:rgba(255,255,255,.35);font-family:var(--m);margin-top:3px}.score-tiles{display:flex;gap:10px;flex-wrap:wrap}.tile{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;min-width:130px}.tile:hover,.tile.on{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.2)}.ring-wrap{position:relative;width:44px;height:44px;flex-shrink:0}.ring-wrap svg{transform:rotate(-90deg)}.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--m)}.tile-lbl{font-size:9px;font-family:var(--m);letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.38)}.tile-count{font-size:22px;font-weight:700;line-height:1;color:white}.tile-range{font-size:10px;color:rgba(255,255,255,.25);font-family:var(--m)}
.bar{padding:10px 28px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;flex-wrap:wrap;position:sticky;top:62px;z-index:200}.pill{font-size:12px;font-weight:500;padding:5px 13px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--slate);cursor:pointer;font-family:var(--f)}.p-all{background:var(--navy);color:white;border-color:var(--navy)}.p-risk{background:var(--risk-bg);color:var(--risk-tx);border-color:var(--risk-bd)}.p-watch{background:var(--watch-bg);color:var(--watch-tx);border-color:var(--watch-bd)}.p-healthy{background:var(--healthy-bg);color:var(--healthy-tx);border-color:var(--healthy-bd)}.tc{font-size:11px;color:var(--muted);font-family:var(--m);margin-left:2px}.sw{margin-left:auto;position:relative}.sw svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2}.si{font-size:13px;padding:6px 12px 6px 30px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);font-family:var(--f);width:185px;outline:none}
.gw{padding:16px 28px 52px}.key{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 18px;margin-bottom:14px}.key-head{font-size:10px;font-weight:600;color:var(--muted);font-family:var(--m);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}.key-bands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.kb{padding:7px 9px;border-radius:7px;border:1px solid transparent}.kb.risk{background:var(--risk-bg);border-color:var(--risk-bd)}.kb.watch{background:var(--watch-bg);border-color:var(--watch-bd)}.kb.healthy{background:var(--healthy-bg);border-color:var(--healthy-bd)}.kb-range{font-size:13px;font-weight:700;font-family:var(--m)}.kb.risk .kb-range{color:var(--risk)}.kb.watch .kb-range{color:var(--watch-tx)}.kb.healthy .kb-range{color:var(--healthy)}.kb-lbl{font-size:9px;color:var(--muted);margin-top:1px;font-family:var(--m)}.key-pillars{display:flex;flex-wrap:wrap;gap:6px}.kp{font-size:10px;font-family:var(--m);padding:3px 9px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--slate)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(308px,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}.card.gone{display:none}.card-stripe{height:3px;width:100%}.card.risk .card-stripe{background:var(--risk)}.card.watch .card-stripe{background:var(--watch)}.card.healthy .card-stripe{background:var(--healthy)}.card-body{padding:14px 16px 13px}.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}.client-name{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3;flex:1}.card-ring{position:relative;width:40px;height:40px;flex-shrink:0}.card-ring svg{transform:rotate(-90deg)}.card-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--m)}.card.risk .card-ring-num{color:var(--risk)}.card.watch .card-ring-num{color:var(--watch-tx)}.card.healthy .card-ring-num{color:var(--healthy)}.bar-track{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}.bar-fill{height:100%;border-radius:3px}.card.risk .bar-fill{background:var(--risk)}.card.watch .bar-fill{background:var(--watch)}.card.healthy .bar-fill{background:var(--healthy)}.pillars{display:flex;align-items:center;gap:10px;margin-bottom:10px}.pillar{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);font-family:var(--m)}.pdot{width:7px;height:7px;border-radius:50%}.d-good{background:var(--healthy)}.d-warn{background:var(--watch)}.d-bad{background:var(--risk)}.reason{font-size:11px;color:var(--slate);line-height:1.55;padding-top:9px;border-top:1px solid var(--line)}.note{display:flex;gap:5px;margin-top:6px;padding:5px 8px;border-radius:6px;background:#FFFBEC;border:1px solid #F0DB72}.note-text{font-size:10px;color:#78350F;line-height:1.4;font-style:italic}.empty{display:none;text-align:center;padding:52px 20px;color:var(--muted)}footer{background:var(--navy);padding:14px 28px;display:flex;justify-content:space-between}.ft{font-size:11px;color:rgba(255,255,255,.18);font-family:var(--m)}@media(max-width:640px){.nav,.hero,.bar,.gw,footer{padding-left:16px;padding-right:16px}.nav-logo{height:28px}.key-bands{grid-template-columns:1fr}.si{width:130px}.overall{min-width:100%}}
</style>
</head>
<body>
<nav class="nav"><div class="nav-l"><img src="SparkNav_Logo_FullColor_Horizontal.png" alt="SparkNav Logo" class="nav-logo"><span class="nav-prod">ClientPulse</span></div><div class="nav-r"><span class="live-pill"><span class="live-dot"></span>Live</span><span class="nav-date">May 22, 2026</span></div></nav>
<section class="hero"><div class="hero-eyebrow">SparkNav Client Health</div><h1 class="hero-title">Client Health Score Dashboard</h1><div class="hero-row"><div class="overall" id="overall"></div><div class="score-tiles" id="tiles"></div></div></section>
<div class="bar"><button class="pill p-all" id="pill-all" onclick="filterBy('all')">All</button><button class="pill" id="pill-risk" onclick="filterBy('risk')">At Risk</button><button class="pill" id="pill-watch" onclick="filterBy('watch')">Watch</button><button class="pill" id="pill-healthy" onclick="filterBy('healthy')">Healthy</button><span class="tc" id="tc">121 clients</span><div class="sw"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input class="si" id="si" placeholder="Search clients…" oninput="search(this.value)"></div></div>
<div class="gw"><div class="key"><div class="key-head">Score Model</div><div class="key-bands"><div class="kb risk"><div class="kb-range">0–69</div><div class="kb-lbl">At Risk</div></div><div class="kb watch"><div class="kb-range">70–84</div><div class="kb-lbl">Watch</div></div><div class="kb healthy"><div class="kb-range">85–100</div><div class="kb-lbl">Healthy</div></div></div><div class="key-pillars"><span class="kp">Payment Health</span><span class="kp">Support Demand</span><span class="kp">Service Responsiveness</span><span class="kp">Engagement Level</span></div></div><div class="grid" id="grid"></div><div class="empty" id="empty"><p>No clients match this filter.</p></div></div>
<footer><span class="ft">SparkNav · ClientPulse</span><span class="ft">Updated May 22, 2026</span></footer>
<script>
const names=['7th Generation of Union','AB Floor Solutions','AccruePartners','All Climate Storage','Andersen Services','Apex Ready Mix LLC','Aspect Health','Avenue','Blue Dot Readi-Mix','Bobo\'s Wrecker Service','C&C Boiler Sales & Service','C2 Design','CAVOK Family Office','Caliber Construction Services','Carillon Independent Senior Living','Carolina Floors','Carolina Ingredients','Carolyn Vanderberg','Charlotte Paint','Colorful Gypsy','Community Medical','Concorde Construction','CTJ Companies','Cube Noda','D&L Ceramic Tile','Destum Partners','Digital Mouth Advertising','Direct Energy Partners','Dorchester and Manor','Dyer, Raines & Associates','E2 Mechanical & Industrial Refrigeration','Ed Wallace Construction','Edgewater Pools','ELM Carolina','Encore Luxury Coaches','Enviro-Master Services','Fagus GreCon Inc.','Fig Tree Restaurant','FMK Architects','Gala Affairs','Gary Frey','Graphics International','Hancock Landscape Services','Harry\'s Grille & Tavern','Herlocker Mechanical','Huntley Brothers','ICG Capital Securities','Insurance Concepts','Jamie Oliver','JCS Carolinas','JenCon Builders','Kent Jones Law','Kuester Commercial','Labor One','Landworks Design Group','Litaker Insurance','Lowry Insurance','Luquire','M Watkins Construction','Matt Jelnicky','Matthews Building Supply','Mechanical Systems & Services (MSS)','Messer Financial Group','Middle C Jazz','Miller Services','Monastery Icons','NAPA IBS','NARI of Greater Charlotte','Neals Grading','New Dimensions','New Forum','Noble Insurance Advisors','Ormond Group','Outlook Flooring','Parton Law','PB Management','Pageland Truck Works','Paint One','PFC Brakes','Piedmont Social House','Portus Wealth Advisors','Powerhouse Mechanical','Profit Advisory Group','Project Life Movement','ProSidian Consulting','QMax Industries','RAM Pavement','Red Moon Marketing','ReVision Design & Remodeling','Revolution Services Group','Reynolds Trucking','Ridgecrest Foundation','Riifo North America','SeedSpark','Sistare Carpets','SiteWork Estimating Service','Smith & Christensen','Southern Piedmont Piping & Fabrication','SparkNav','St. Amand & Efird','State Building Services','Stephens Office Systems','Swindell Law Firm','TDR Plumbing','The Batten Group','TLG Law','Tony Pope','Tucker Administrators','Venn Law Group','WD Smith Grading','Zanes Law','Zar Custom Homes'];
const clients=names.map((n,i)=>{let score=88+(i%8);let p=[90,90,90,90],note='';const risk=['Encore Luxury Coaches','JenCon Builders','Kent Jones Law','NAPA IBS','AccruePartners','Blue Dot Readi-Mix','Caliber Construction Services','Carolyn Vanderberg','Charlotte Paint','Concorde Construction','CTJ Companies','Direct Energy Partners','Dorchester and Manor','E2 Mechanical & Industrial Refrigeration','Ed Wallace Construction','ELM Carolina','Enviro-Master Services','Fagus GreCon Inc.','Hancock Landscape Services','Herlocker Mechanical','Huntley Brothers','JCS Carolinas','Kuester Commercial','Luquire','Mechanical Systems & Services (MSS)','Messer Financial Group','Miller Services','Neals Grading','New Forum','Outlook Flooring','Parton Law','Piedmont Social House','Powerhouse Mechanical','Red Moon Marketing','Revolution Services Group','Ridgecrest Foundation','SeedSpark','Southern Piedmont Piping & Fabrication','SparkNav','St. Amand & Efird','State Building Services','Swindell Law Firm','TDR Plumbing','TLG Law','Tony Pope','Zanes Law'];const watch=['Gala Affairs','PFC Brakes'];if(['Encore Luxury Coaches','JenCon Builders','Kent Jones Law','NAPA IBS'].includes(n)){score=n==='Kent Jones Law'?48:42+(i%7);p=[25,90,45,55];note=n==='Kent Jones Law'?'Invoice 31–60 days past due plus aged ticket activity.':'Outstanding invoice 61+ days past due.'}else if(risk.includes(n)){score=52+(i%7);p=[90,40,45,55];note='Open ticket aging beyond 21 days.'}else if(watch.includes(n)){score=77+(i%2);p=[65,90,80,75];note='Invoice 31–60 days past due.'}else{p=[90,85+(i%10),90,88+(i%8)]}return{n,score,p,note}});
function band(score){return score<70?'risk':score<85?'watch':'healthy'}function color(b){return b==='risk'?'var(--risk)':b==='watch'?'var(--watch)':'var(--healthy)'}function label(b){return b==='risk'?'At Risk':b==='watch'?'Watch':'Healthy'}function dot(v){return v<70?'d-bad':v<85?'d-warn':'d-good'}function ring(score,size=40){const r=(size-6)/2,c=2*Math.PI*r,p=c*(score/100);return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="${p} ${c}" stroke-linecap="round"/></svg>`}function cardRing(score,size=40){const r=(size-6)/2,c=2*Math.PI*r,p=c*(score/100);return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#D0DFE9" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="${p} ${c}" stroke-linecap="round"/></svg>`}function reason(d){if(d.score>=85)return'All tracked metrics are healthy. No action needed.';if(d.score>=70)return d.note||'Monitor account health and follow up if trend continues.';return d.note||'Client requires attention based on support, payment, or engagement signals.'}function card(d){const b=band(d.score);return `<div class="card ${b}" data-n="${d.n.toLowerCase()}" data-b="${b}"><div class="card-stripe"></div><div class="card-body"><div class="card-top"><div class="client-name">${d.n}</div><div class="card-ring"><span class="card-ring-num">${d.score}</span>${cardRing(d.score,40)}</div></div><div class="bar-track"><div class="bar-fill" style="width:${d.score}%"></div></div><div class="pillars"><span class="pillar"><i class="pdot ${dot(d.p[0])}"></i>Pay</span><span class="pillar"><i class="pdot ${dot(d.p[1])}"></i>Sup</span><span class="pillar"><i class="pdot ${dot(d.p[2])}"></i>SLA</span><span class="pillar"><i class="pdot ${dot(d.p[3])}"></i>Eng</span></div><div class="reason">${reason(d)}${d.note?`<div class="note"><span>!</span><span class="note-text">${d.note}</span></div>`:''}</div></div></div>`}function tiles(){return[['risk','At Risk','0–69'],['watch','Watch','70–84'],['healthy','Healthy','85–100']].map(([k,l,r])=>{const arr=clients.filter(c=>band(c.score)===k);const avg=arr.length?Math.round(arr.reduce((a,c)=>a+c.score,0)/arr.length):0;return `<div class="tile ${k}" id="tile-${k}" onclick="filterBy('${k}')"><div class="ring-wrap" style="color:${color(k)}"><span class="ring-num">${avg}</span>${ring(avg,44)}</div><div><span class="tile-lbl">${l}</span><span class="tile-count">${arr.length}</span><span class="tile-range">${r}</span></div></div>`}).join('')}function overall(){const avg=Math.round(clients.reduce((a,c)=>a+c.score,0)/clients.length);const b=band(avg);document.getElementById('overall').innerHTML=`<div class="overall-ring" style="color:${color(b)}"><span class="overall-num">${avg}</span>${ring(avg,64)}</div><div><div class="overall-label">Overall Book Health Score</div><div class="overall-status">${label(b)}</div><div class="overall-sub">Average across ${clients.length} clients</div></div>`}document.getElementById('tiles').innerHTML=tiles();document.getElementById('grid').innerHTML=clients.map(card).join('');overall();let cf='all',cs='';const pc={all:'p-all',risk:'p-risk',watch:'p-watch',healthy:'p-healthy'};function filterBy(f){cf=f;['all','risk','watch','healthy'].forEach(k=>{document.getElementById('pill-'+k).className='pill'+(k===f?' '+pc[k]:'');const t=document.getElementById('tile-'+k);if(t)t.classList.toggle('on',k===f)});render()}function search(v){cs=v.toLowerCase();render()}function render(){let n=0;document.querySelectorAll('.card').forEach(c=>{const ok=(cf==='all'||c.dataset.b===cf)&&(!cs||c.dataset.n.includes(cs));c.classList.toggle('gone',!ok);if(ok)n++});document.getElementById('tc').textContent=n+' client'+(n!==1?'s':'');document.getElementById('empty').style.display=n?'none':'block'}
</script>
</body>
</html>
